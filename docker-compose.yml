services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: creditrisk_api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    environment:
      - ENVIRONMENT=production
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - credit_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: creditrisk_frontend
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    environment:
      - API_URL=http://api:8000
      - PYTHONUNBUFFERED=1
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - credit_network

networks:
  credit_network:
    driver: bridge